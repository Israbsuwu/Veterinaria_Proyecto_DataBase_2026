{% extends "shop/base.html" %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="auth-wrap" style="max-width:560px;">
  <div class="auth-card">
    <div class="auth-logo">🐾</div>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Compra en línea, registra a tus mascotas y agenda citas.</p>

    <form method="POST" action="{{ url_for('auth.shop_register') }}" data-register-form>
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required autocomplete="family-name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" required placeholder="001-000000-0000A">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel">
        </div>
      </div>
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" autocomplete="street-address">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" name="confirmar" required minlength="6" autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear mi cuenta</button>
    </form>

    <p class="auth-alt">¿Ya tienes cuenta? <a href="{{ url_for('auth.shop_login') }}">Inicia sesión</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("[data-register-form]");
    if (!form) return;
    form.addEventListener("submit", function (event) {
      const password = form.querySelector('[name="contrasena"]').value;
      const confirmation = form.querySelector('[name="confirmar"]').value;
      if (password !== confirmation) {
        event.preventDefault();
        window.App.toast("Las contraseñas no coinciden.", "error");
      }
    });
  });
</script>
{% endblock %}
