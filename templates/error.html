<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · {{ clinic_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { align-items: center; justify-content: center; padding: 2rem; }
    .error-card { max-width: 460px; width: 100%; text-align: center; padding: 2.4rem; }
    .error-code { font-size: 4rem; font-weight: 800; color: #38bdf8; line-height: 1; }
    .error-card h1 { color: #fff; font-size: 1.3rem; margin: 1rem 0 .4rem; }
    .error-card p { color: var(--text-muted); font-size: .9rem; margin-bottom: 1.5rem; }
    .error-actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="card error-card">
    <div class="error-code">{{ code }}</div>
    <h1>{{ 'Acceso restringido' if code == 403 else 'No encontrado' if code == 404 else 'Algo salió mal' }}</h1>
    <p>{{ mensaje }}</p>
    <div class="error-actions">
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Ir al inicio</a>
      <a href="{{ url_for('shop.home') }}" class="btn btn-secondary">Ver tienda</a>
    </div>
  </div>
</body>
</html>
